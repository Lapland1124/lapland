<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無限可能 - 快门即是永恒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  #intro-screen {
    position: absolute;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    animation: fadeOutSequence 5s ease forwards;
  }
  
  #intro-screen h1 {
    font-size: 60px;
    letter-spacing: 5px;
    margin-bottom: 15px;
    opacity: 0; filter: blur(15px); transform: translateY(20px);
    animation: showUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s;
  }
  
  #intro-screen p {
    font-size: 22px;
    color: #888;
    letter-spacing: 6px;
    opacity: 0; filter: blur(10px); transform: translateY(20px);
    animation: showUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 1.2s;
  }

  #version-display {
    position: absolute;
    bottom: 30px;
    right: 40px;
    font-size: 14px;
    color: #555;
    letter-spacing: 2px;
    font-family: monospace;
    opacity: 0;
    animation: showUp 1s ease forwards 2s;
  }

  #main-screen {
    display: flex;
    width: 100%;
    height: 100vh;
    opacity: 0;
    animation: showUp 1.5s ease forwards 4.5s;
    pointer-events: none;
  }
  #main-screen.active { pointer-events: auto; }

  .left-menu {
    width: 45%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 12%;
    gap: 30px;
    z-index: 2;
  }

  .menu-btn {
    background: transparent;
    border: none;
    color: #555;
    font-size: 40px;
    font-weight: bold;
    text-align: left;
    cursor: pointer;
    transition: all 0.4s ease;
    letter-spacing: 3px;
  }
  
  .menu-btn:hover {
    color: #fff;
    transform: translateX(15px);
    text-shadow: 0 0 30px rgba(255,255,255,0.4);
  }

  .right-images {
    width: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .hover-img {
    position: absolute;
    width: 80%;
    height: 80%;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: scale(0.95) translateX(20px);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  .hover-img.show {
    opacity: 1;
    transform: scale(1) translateX(0);
  }

  #img-camera {
    background-image: url('camera.jpg');
  }

  #img-rent {
    background-image: url('rent.jpg');
  }

  #announcement-modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 50;
    opacity: 0;
    visibility: hidden;
    transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  #announcement-modal.active {
    opacity: 1;
    visibility: visible;
  }

  .modal-content {
    background: #111;
    border: 1px solid #333;
    padding: 40px;
    border-radius: 16px;
    max-width: 500px;
    width: 90%;
    color: #ccc;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    transform: translateY(20px);
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #announcement-modal.active .modal-content { transform: translateY(0); }

  .modal-content h2 { color: #fff; margin-bottom: 20px; font-size: 24px; letter-spacing: 1px; }
  .modal-content ul { line-height: 2; margin-bottom: 30px; font-size: 15px; color: #aaa; padding-left: 20px; }
  .modal-content label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #888; cursor: pointer; margin-bottom: 30px; user-select: none; }
  .modal-content input[type="checkbox"] { accent-color: #fff; width: 16px; height: 16px; cursor: pointer; }

  .modal-content button {
    width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; letter-spacing: 2px;
  }
  .modal-content button:hover { background: #ccc; transform: scale(1.02); }

  #detail-page {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.8s ease;
    z-index: 20;
    cursor: pointer;
  }
  
  #detail-page.active { opacity: 1; visibility: visible; }
  #detail-page h1 { color: #fff; font-size: 50px; letter-spacing: 5px; }
  #detail-page p { color: #555; margin-top: 20px; font-size: 16px; }

  @keyframes showUp { to { opacity: 1; filter: blur(0); transform: translateY(0); } }
  @keyframes fadeOutSequence { 0%, 60% { opacity: 1; filter: blur(0); } 100% { opacity: 0; filter: blur(20px); visibility: hidden; } }
</style>
</head>
<body>

  <div id="intro-screen">
    <h1>無限可能</h1>
    <p>快门即是永恒</p >
    <div id="version-display">beta v0.15</div>
  </div>

  <div id="main-screen">
    <div class="left-menu">
      <button class="menu-btn" data-target="img-camera">商业拍摄</button>
      <button class="menu-btn" data-target="img-rent">影视道具租赁</button>
    </div>
    
    <div class="right-images">
      <div id="img-camera" class="hover-img"></div>
      <div id="img-rent" class="hover-img"></div>
    </div>
  </div>

  <div id="announcement-modal">
    <div class="modal-content">
      <h2>v0.15 更新说明</h2>
      <ul>
        <li>新增左侧悬浮菜单与右侧动态图片展示</li>
        <li>加入电影级入场动画与淡出转场</li>
        <li>加入右下角版本号显示</li>
      </ul>
      <label>
        <input type="checkbox" id="dont-show-again"> 选择本次更新公告不再提示
      </label>
      <button id="close-announcement">我知道了</button>
    </div>
  </div>

  <div id="detail-page">
    <h1>正在制作</h1>
    <p>（点击屏幕任意位置返回）</p >
  </div>

  <script>
    const CURRENT_VERSION = 'v0.15';

    setTimeout(() => {
      document.getElementById('main-screen').classList.add('active');
      const hasSeen = localStorage.getItem('hasSeenAnnouncement_' + CURRENT_VERSION);
      if (!hasSeen) {
        document.getElementById('announcement-modal').classList.add('active');
      }
    }, 5000);

    document.getElementById('close-announcement').addEventListener('click', () => {
      const dontShowCheckbox = document.getElementById('dont-show-again');
      if (dontShowCheckbox.checked) {
        localStorage.setItem('hasSeenAnnouncement_' + CURRENT_VERSION, 'true');
      }
      document.getElementById('announcement-modal').classList.remove('active');
    });

    const buttons = document.querySelectorAll('.menu-btn');
    const images = document.querySelectorAll('.hover-img');

    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        images.forEach(img => img.classList.remove('show'));
        const targetId = btn.getAttribute('data-target');
        document.getElementById(targetId).classList.add('show');
      });
      
      btn.addEventListener('mouseleave', () => {
        images.forEach(img => img.classList.remove('show'));
      });

      btn.addEventListener('click', () => {
        document.getElementById('detail-page').classList.add('active');
      });
    });

    document.getElementById('detail-page').addEventListener('click', () => {
      document.getElementById('detail-page').classList.remove('active');
    });
  </script>
</body>
</html>
