<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  /* 基础设置：黑底白字，禁止滚动 */
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
  }

  /* 苹果风格的字体 */
  h1 {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -1px;
    margin-bottom: 10px;
    /* 初始状态：透明、模糊、往下掉一点点 */
    opacity: 0;
    filter: blur(10px);
    transform: translateY(20px);
    /* 动画：名称 时长 缓动函数 保持最后状态 延迟时间 */
    animation: appleFadeIn 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.3s;
  }

  p {
    font-size: 20px;
    color: #86868b; /* 苹果常用的灰色 */
    margin-top: 0;
    opacity: 0;
    filter: blur(10px);
    transform: translateY(20px);
    animation: appleFadeIn 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.8s; /* 比标题晚一点出来 */
  }

  /* 定义动画过程：从透明/模糊，变成清晰/归位 */
  @keyframes appleFadeIn {
    100% {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Lapland</h1>
    <p>Think different. 你的第一个网页。</p>
  </div>

</body>
</html>
