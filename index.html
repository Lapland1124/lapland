<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的专属主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  主体 { 
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
: 线性渐变(135度, #667eea 0%, #764ba2 100%);
    最小高度: 100视口高度;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
  }
  .card {
    背景: rgba(255, 255, 255, 0.95);
    内边距: 40px;
    圆角半径: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    max-width: 500px;
    宽度: 90%;
    文本对齐: 居中;
    过渡: 变换 0.3秒 缓动;
  }
  .卡片:悬停 {
    变换: 平移Y轴(-5像素);
  }
  h1 { color: #4a5568; margin-bottom: 10px; font-size: 28px; }
  .标签 { 颜色: #718096; 字体大小: 16px; 下边距: 25px; }
  .内容 { 文本对齐: 左对齐; 行高: 1.8; 颜色: #4a5568; }
  .highlight { color: #667eea; font-weight: bold; }
</style>
</head>
<body>
  <div class="card">
    <h1>你好，我是 Lapland 👋</h1>
    <p class="tag">这是我在互联网上的小天地</p>
    <div class="content">
      <p>✨ <span class="highlight">关于我：</span>一个刚刚解锁建站技能的新手。</p>
      <p>🚀 <span class="highlight">目前在做：</span>学习怎么让这个网页变得更酷。</p>
      <p>📅 <span class="highlight">建站时间：</span>2026 年 10 月。</p>
    </div>
  </div>
</body>
</html>
