<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
>欢迎</标题>
<style>
  /* 基础设置：黑底白字，禁止滚动 */
  主体 {
    边距: 0;
    内边距: 0;
    背景颜色: #000;
    文字颜色: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    高度: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    文本对齐: 居中;
  }

  /* 苹果风格的字体 */
  h1 {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -1px;
    margin-bottom: 10px;
    /* 初始状态：透明、模糊、往下掉一点点 */
    opacity: 0;
    滤镜: 模糊(10像素);
    变换: 平移Y轴(20像素);
    /* 动画：名称 时长 缓动函数 保持最后状态 延迟时间 */
    动画: appleFadeIn 1.5秒 缓动函数(0.2, 0.8, 0.2, 1) 延迟;
    动画延迟: 0.3秒;
  }

  p {
    字体大小: 20px;
    颜色: #86868b; /* 苹果常用的灰色 */
    上边距: 0;
    opacity: 0;
    滤镜: 模糊(10像素);
    变换: 平移Y轴(20像素);
    动画: appleFadeIn 1.5秒 缓动函数(0.2, 0.8, 0.2, 1) 延迟;
    animation-delay: 0.8s; /* 比标题晚一点出来 */
  }

  /* 定义动画过程：从透明/模糊，变成清晰/归位 */
  @keyframes appleFadeIn {
    100% {
      opacity: 1;
      滤镜: 模糊(0);
      变换: 沿Y轴平移(0);
    }
  }
</style>
</head>
<body>

  <div 类="容器">
    <h1>拉普兰</h1>
    <p>另辟蹊径。你的第一个网页。</p>
  </div>

</body>
</html>
